version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: finguard-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: finguard
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: finguard-backend
    environment:
      DATABASE_URL: postgresql://postgres:postgrespassword@postgres:5432/finguard
      SECRET_KEY: finguard-super-secret-development-key-change-in-production
      MODEL_PATH: /ml/models/fraud_detector_v1.joblib
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: finguard-frontend
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  postgres_data:
